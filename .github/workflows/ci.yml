name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host module (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.6 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Lint
        run: |
          $findings = Invoke-ScriptAnalyzer -Path host -Recurse -Settings host/PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize | Out-String | Write-Output
          if ($findings) { exit 1 }
      - name: Test
        run: ./host/tests/Invoke-Tests.ps1 -CI
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shell }}
          path: host/tests/testResults.xml

  docs:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            *.md
            docs/**/*.md
            host/**/*.md
            wiiu/**/*.md
            research/**/*.md
